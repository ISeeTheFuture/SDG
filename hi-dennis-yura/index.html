<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hello</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 45%, rgba(255,255,255,.08), transparent 30%),
        linear-gradient(135deg, #07080c, #111827 55%, #07080c);
      font-family: Arial, Helvetica, sans-serif;
    }
    #hello {
      margin: 0;
      padding: 24px;
      text-align: center;
      font-size: clamp(2.7rem, 9vw, 7rem);
      font-weight: 800;
      letter-spacing: 0.08em;
      color: #fff;
      user-select: none;
      animation: sparkle 1.8s ease-in-out infinite alternate;
      text-shadow:
        0 0 8px rgba(255,255,255,.65),
        0 0 20px rgba(255,255,255,.35),
        0 0 42px rgba(120,190,255,.35);
    }
    @keyframes sparkle {
      0% {
        opacity: .72;
        transform: scale(.985);
        filter: brightness(.9);
        text-shadow:
          0 0 5px rgba(255,255,255,.45),
          0 0 12px rgba(255,255,255,.20),
          0 0 26px rgba(120,190,255,.20);
      }
      55% {
        opacity: 1;
        transform: scale(1.015);
        filter: brightness(1.25);
        text-shadow:
          0 0 10px rgba(255,255,255,.9),
          0 0 26px rgba(255,255,255,.55),
          0 0 58px rgba(120,190,255,.55);
      }
      100% {
        opacity: .86;
        transform: scale(1);
        filter: brightness(1.05);
      }
    }
  </style>
</head>
<body>
  <h1 id="hello"></h1>
  <script>
    const names = ["DENNIS", "YURA"];
    const picked = names[Math.floor(Math.random() * names.length)];
    document.getElementById("hello").textContent = `HI, ${picked}`;
  </script>
</body>
</html>
